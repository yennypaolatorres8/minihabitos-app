[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/registrar-ingreso"
  to = "/.netlify/functions/registrar-ingreso"
  status = 200

[[redirects]]
  from = "/api/consultar-racha"
  to = "/.netlify/functions/consultar-racha"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
